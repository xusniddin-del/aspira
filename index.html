<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aspira — Klinika boshqaruvi</title>
<meta name="theme-color" content="#0069F9">
<meta name="description" content="Klinika uchun qabul, bemorlar, kassa va hisobotlar — bitta oynada.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7FC;--card:#fff;--ink:#0B1B3A;--ink2:#344054;--muted:#55627A;--line:#E3E9F3;
  --blue:#0069F9;--blue-d:#0057D6;--blue-50:#EAF3FF;--blue-100:#D3E6FF;--brand:#047DFF;
  --green:#067647;--green-50:#E6F6EE;--red:#D92D20;--red-50:#FEF0EF;--amber:#B54708;--amber-50:#FFF4E5;--violet:#7A5AF8;
  --r:16px;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--muted);font-weight:600}
.layout{display:flex;min-height:100vh}

/* Sidebar */
.side{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 22px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--blue);display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px rgba(0,105,249,.28);flex:none}
.logo svg{width:auto;height:23px;display:block}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.3px;display:block}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:var(--muted);font-weight:700;cursor:pointer;text-decoration:none;margin-bottom:3px;transition:.15s}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--blue-50);color:var(--blue)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px}
.me b{font-size:13.5px;display:block}.me small{font-size:12px;color:var(--muted);font-weight:600}
.me .x{margin-left:auto}
.credit{font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 8px 0}
.credit a{color:var(--blue);text-decoration:none;font-weight:700}

/* Main */
.main{flex:1;min-width:0;padding:26px 30px 48px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.top p{color:var(--muted);font-weight:600;margin-top:3px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mtop{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;transition:.15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.green{background:var(--green)}.btn.green:hover{background:#05603A}
.btn.danger{background:#fff;color:var(--red);border:1px solid #FBD5D2}.btn.danger:hover{background:var(--red-50)}
.btn:disabled{opacity:.6;cursor:default}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink2);flex:none}
.x:hover{background:var(--line)}
.link{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;padding:0}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 12px}
.card-h h3{font-size:15px;font-weight:800;letter-spacing:-.2px}
.card-b{padding:0 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi{padding:16px 18px}
.kpi .l{color:var(--muted);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:9px}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.7px;margin-top:10px;white-space:nowrap}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.ic svg{width:16px;height:16px}
.ic.b{background:var(--blue-50);color:var(--blue)}.ic.g{background:var(--green-50);color:var(--green)}.ic.r{background:var(--red-50);color:var(--red)}.ic.a{background:var(--amber-50);color:var(--amber)}.ic.v{background:#F1EDFF;color:var(--violet)}
.up{color:var(--green)}.down{color:var(--red)}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-bottom:14px}
.grid2>*,.kpis>*{min-width:0}
.alert{display:flex;gap:14px;align-items:center;padding:14px 18px;margin-bottom:14px;background:#FFF8F7;border-color:#FBD5D2}
.alert.warn{background:#FFFAF2;border-color:#FEDF89}
.alert b{font-weight:800}

/* Table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:700;padding:10px 18px;border-bottom:1px solid var(--line);background:#FAFBFD;white-space:nowrap}
td{padding:12px 18px;border-bottom:1px solid var(--line);font-weight:600;color:var(--ink2);white-space:nowrap}
td b{color:var(--ink)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#F8FAFF}
.r{text-align:right}
.grid2 td{white-space:normal}.grid2 td.r,.grid2 td:first-child,.grid2 td.nw{white-space:nowrap}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-weight:600}

.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.t-new{background:var(--blue-50);color:var(--blue-d)}.t-came{background:var(--amber-50);color:#B54708}.t-done{background:var(--green-50);color:#067647}.t-noshow{background:var(--red-50);color:#B42318}.t-cancel{background:#F2F4F7;color:#475467}
.t-debt{background:var(--red-50);color:#B42318}.t-adv{background:var(--green-50);color:#067647}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.av{width:38px;height:38px;border-radius:12px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.av.lg{width:54px;height:54px;border-radius:16px;font-size:18px}
.who{display:flex;align-items:center;gap:11px}
.who small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:1px}
.tg{color:#229ED9;display:inline-flex}

/* Forms */
.in{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;outline:none;font-weight:600;transition:.15s;min-height:42px}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,105,249,.14)}
textarea.in{resize:vertical;min-height:70px}
label.f,div.f{display:block;margin-bottom:14px}
.f>span,.fl{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.srch{position:relative;max-width:340px;flex:1}
.srch svg{position:absolute;left:12px;top:12px;color:var(--muted);width:17px;height:17px}
.srch .in{padding-left:38px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;font-weight:700;cursor:pointer;transition:.15s;background:#fff}
.pill input:checked+span{border-color:var(--blue);background:var(--blue-50);color:var(--blue)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--blue-50);color:var(--blue)}
.svc-list{border:1px solid var(--line);border-radius:12px;max-height:210px;overflow:auto}
.svc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}
.svc:last-child{border-bottom:0}
.svc:hover{background:#F8FAFF}
.svc input{width:17px;height:17px;accent-color:var(--blue)}
.svc em{margin-left:auto;font-style:normal;color:var(--muted);font-weight:700}
.pp{position:relative}
.pp-list{border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
.pp-i{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600}
.pp-i:last-child{border-bottom:0}
.pp-i:hover{background:#F8FAFF}
.pp-i small{color:var(--muted)}
.pp-i.add{color:var(--blue);font-weight:800}
.pp-sel{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--blue-100);background:var(--blue-50);border-radius:12px;padding:10px 12px}
.pp-sel small{display:block;color:var(--muted);font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch b{display:block}.switch small{color:var(--muted);font-weight:600}
.tgl{position:relative;width:44px;height:26px;flex:none}
.tgl input{opacity:0;width:0;height:0}
.tgl i{position:absolute;inset:0;background:#D0D5DD;border-radius:99px;cursor:pointer;transition:.2s}
.tgl i:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl input:checked+i{background:var(--blue)}
.tgl input:checked+i:before{transform:translateX(18px)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors label input{display:none}
.colors label i{display:block;width:30px;height:30px;border-radius:9px;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.colors label input:checked+i{box-shadow:0 0 0 2px var(--ink)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(14,26,51,.42);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fd .15s}
.md{background:#fff;border-radius:20px;width:100%;max-width:540px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(14,26,51,.25);animation:pop .18s}
.md.wide{max-width:800px}
.md.sm{max-width:400px}
.md-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}
.md-h h3{font-size:17px;font-weight:800;letter-spacing:-.2px}
.md-b{padding:20px 22px}
.md-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;position:sticky;bottom:0;background:#fff;flex-wrap:wrap}
@keyframes fd{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
#toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:99;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.info div{background:var(--bg);border-radius:12px;padding:11px 13px}
.info small{display:block;color:var(--muted);font-weight:700;font-size:11.5px;margin-bottom:3px}
.info b{font-weight:800;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border-radius:8px;padding:5px 10px;font-weight:700;font-size:12.5px;color:var(--ink2)}
.st-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.st-row button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 6px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink2);transition:.15s}
.st-row button:hover{border-color:var(--blue-100);background:#F8FAFF}
.st-row button.on{border-color:var(--blue);background:var(--blue-50);color:var(--blue)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -22px 16px;padding:0 22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 18px}
.fin div{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.fin small{display:block;color:var(--muted);font-weight:700;font-size:11.5px}
.fin b{font-size:16px;font-weight:800}
.hist{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.hist:hover{border-color:var(--blue-100);background:#FAFCFF}
.hist-t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist p{color:var(--ink2);font-weight:600;margin-top:6px;font-size:13px}

/* Chart */
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding:6px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:var(--blue-100);min-height:3px;transition:.3s}
.bar.today i{background:var(--blue)}
.bar:hover i{background:var(--blue)}
.bar span{font-size:11px;color:var(--muted);font-weight:700}
.hb{margin-bottom:13px}
.hb-t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;gap:8px}
.hb-t span{color:var(--muted)}
.hb-l{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.hb-l i{display:block;height:100%;border-radius:99px}

/* Calendar */
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-bar h2{font-size:16px;font-weight:800;margin:0 6px}
.cal{overflow:auto;max-height:calc(100vh - 220px);position:relative}
.cal-in{display:grid;min-width:max-content}
.cal-hd{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:12px 14px;font-weight:800;display:flex;align-items:center;gap:8px}
.cal-hd small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.cal-hd.c0{left:0;z-index:6;border-left:0}
.cal-times{position:sticky;left:0;z-index:3;background:#fff}
.cal-times div{position:absolute;left:0;right:0;text-align:right;padding-right:10px;font-size:11.5px;font-weight:700;color:var(--muted);transform:translateY(-7px)}
.cal-times div:first-child{transform:translateY(3px)}
.cal-col{position:relative;border-left:1px solid var(--line);cursor:copy;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--h) - 1px),#EEF1F6 calc(var(--h) - 1px),#EEF1F6 var(--h))}
.cal-col.off{background-color:#FAFBFD}
.ap{position:absolute;left:5px;right:5px;border-radius:10px;padding:6px 9px;cursor:pointer;overflow:hidden;border:1px solid var(--line);border-left:4px solid var(--c);background:#fff;box-shadow:0 2px 6px rgba(16,24,40,.06);transition:.12s;font-size:12.5px}
.ap:hover{box-shadow:0 6px 16px rgba(16,24,40,.12);z-index:2}
.ap b{display:block;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap small{display:block;color:var(--muted);font-weight:700;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap.came{background:#FFFBF2}.ap.done{background:#F2FBF6;border-color:#CDEFDD;border-left-color:var(--c)}.ap.noshow{background:#FFF6F5;opacity:.7}.ap.noshow b{text-decoration:line-through}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:1;pointer-events:none}
.now:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-weight:700;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}

/* Teeth */
.teeth{background:var(--bg);border-radius:14px;padding:16px 10px;overflow-x:auto}
.jaw{display:flex;justify-content:center;gap:3px;min-width:max-content}
.jaw+.jaw{margin-top:12px;padding-top:12px;border-top:1px dashed #CBD3E1}
.jaw .mid{width:10px}
.tooth{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;cursor:pointer;padding:3px 1px;border-radius:8px}
.tooth:hover{background:#fff}
.tooth.sel{background:#fff;box-shadow:0 0 0 2px var(--blue)}
.tooth svg{width:28px;height:32px}
.tooth span{font-size:11px;font-weight:800;color:var(--muted)}
.tlegend{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tlegend button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-weight:700;font-size:12.5px;cursor:pointer}
.tlegend button i{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}
.tlegend button.on{border-color:var(--blue);background:var(--blue-50)}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.lg-art{background:var(--blue);color:#fff;padding:48px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lg-art:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:70px solid rgba(255,255,255,.06);right:-180px;bottom:-200px}
.lg-art .brand b{color:#fff}.lg-art .brand small{color:rgba(255,255,255,.7)}
.lg-art .logo{background:#fff;box-shadow:none}
.lg-art h2{font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-1.2px;margin-top:auto;max-width:480px}
.lg-art p{color:rgba(255,255,255,.8);font-weight:600;font-size:15.5px;margin-top:14px;max-width:440px;line-height:1.55}
.lg-stats{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap;position:relative;z-index:1}
.lg-stats div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 16px;backdrop-filter:blur(6px)}
.lg-stats b{font-size:20px;font-weight:800;display:block}
.lg-stats small{color:rgba(255,255,255,.75);font-weight:600;font-size:12px}
.lg-form{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:#fff}
.lg-box{width:100%;max-width:370px}
.lg-box h1{font-size:27px;font-weight:800;letter-spacing:-.6px}
.lg-box>p{color:var(--muted);font-weight:600;margin:6px 0 26px}
.lg-err{color:var(--red);font-weight:700;min-height:20px;margin:-4px 0 10px}
.demo{margin-top:22px;border:1px dashed var(--blue-100);background:#F8FAFF;border-radius:14px;padding:14px}
.demo b{display:block;font-size:13px;margin-bottom:8px}
.demo button{display:flex;justify-content:space-between;width:100%;border:0;background:#fff;border-radius:9px;padding:8px 11px;margin-top:6px;cursor:pointer;font-weight:700;box-shadow:0 0 0 1px var(--line)}

.mod-row .sp{flex:1}
.plan{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px;border-radius:var(--r);background:var(--blue-50);border:1px solid var(--blue-100);margin-bottom:14px}
.plan b{font-size:18px;font-weight:800}
.more-list a{align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer;text-decoration:none}
.qty{font-weight:800;color:var(--ink)}
.t-low{background:var(--amber-50);color:var(--amber)}

<script>
/* ============================================================
   Aspira — klinika boshqaruv tizimi (v1.1)

// ---------- SOZLAMALAR (faqat shu yerni o'zgartirasiz) ----------
const APP_NAME   = 'Aspira';
const OWNER_PHONE = '+998 90 832 44 36';           // obuna tugaganda ko'rinadigan raqamingiz
const CRM_BOT = 'aspira_crm_bot';                   // Aspira asosiy boti: ro'yxat, to'lov, klinika botini yaratish
const CLINICS = {
  // Har bir klinika uchun bitta qator: 'kalit': 'Apps Script /exec manzili'

};
// -----------------------------------------------------------------

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => (p||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
const nowHM = () => { const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const addDays = (s,n) => { const d=new Date(s+'T00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const num = n => String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const money = n => num(n)+" so'm";
const short = n => { n=Number(n)||0; if(n>=1e9) return (n/1e9).toFixed(1).replace('.0','')+' mlrd'; if(n>=1e6) return (n/1e6).toFixed(1).replace('.0','')+' mln'; if(n>=1e3) return Math.round(n/1e3)+' ming'; return String(n); };
const sum = (arr,f) => arr.reduce((s,x)=>s+(Number(typeof f==='function'?f(x):(f?x[f]:x))||0),0);
const toMin = t => { const [h,m]=String(t||'0:0').split(':').map(Number); return h*60+(m||0); };
const fromMin = m => pad(Math.floor(m/60))+':'+pad(m%60);

const WD = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];

const digits = s => String(s||'').replace(/\D/g,'');

const LS = {

  wallet:'<rect x="2.5" y="5.5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M16.5 14.5h2"/>',

  check:'<path d="m5 12.5 4.5 4.5L19 7"/>',

  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 17.6A2 2 0 0 0 4.1 20.6h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',

  trend:'<path d="m3 17 6-6 4 4 8-8M15 7h6v6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  tooth:'<path d="M7 3C4.5 3 3 5 3 7.5c0 3 1.5 4.5 2 7.5.4 2.5 1 6 2.5 6s1.8-3 2.5-5c.3-1 .7-1.5 2-1.5s1.7.5 2 1.5c.7 2 1 5 2.5 5s2.1-3.5 2.5-6c.5-3 2-4.5 2-7.5C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/>',
  down:'<path d="M12 4v12M6 11l6 6 6-6M4 20h16"/>',
};
const ic = (n,cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24">${ICON[n]||''}</svg>`;
const MARK_D = 'M79.42 73.25 L73.58 76.00 L68.08 79.67 L63.67 83.92 L60.17 88.67 L58.17 92.58 L56.17 99.42 L55.58 103.17 L55.67 110.58 L57.00 117.58 L59.17 124.00 L61.33 128.50 L65.83 135.75 L69.50 140.58 L73.92 145.50 L81.67 153.25 L89.17 159.50 L90.42 159.67 L92.17 158.83 L106.50 149.25 L117.83 140.17 L123.17 135.08 L123.75 133.50 L123.08 132.42 L115.17 126.92 L113.58 126.25 L111.33 126.17 L109.17 126.92 L102.08 131.83 L94.67 136.25 L93.25 136.50 L91.83 135.75 L85.50 128.75 L80.75 122.50 L78.33 118.00 L76.75 113.42 L76.17 109.58 L76.75 103.42 L79.08 98.50 L82.58 94.75 L88.08 91.83 L91.42 91.25 L95.00 91.25 L97.67 91.58 L101.25 92.67 L110.17 96.75 L116.00 97.08 L119.75 96.17 L128.33 92.25 L132.92 91.33 L137.25 91.33 L141.75 92.42 L145.50 94.67 L147.67 96.58 L149.42 98.83 L151.17 102.33 L152.00 105.83 L152.08 109.58 L150.58 116.50 L147.75 122.25 L141.50 130.58 L131.75 140.75 L121.17 149.92 L108.00 159.58 L99.58 164.92 L98.67 166.00 L98.67 166.92 L99.42 167.92 L106.92 173.33 L113.17 177.17 L115.33 177.08 L119.75 174.50 L127.75 168.92 L138.08 160.83 L150.17 149.83 L157.92 141.58 L161.75 136.83 L165.58 131.00 L168.75 124.92 L171.67 116.67 L172.75 110.25 L172.75 103.50 L172.33 99.67 L170.92 94.50 L169.67 91.25 L166.92 86.75 L164.33 83.42 L160.75 80.00 L154.83 75.92 L149.17 73.25 L145.42 72.17 L139.75 71.33 L133.75 71.50 L125.92 73.17 L119.25 75.67 L114.25 76.33 L109.58 75.83 L101.67 73.00 L93.17 71.42 L84.92 71.83ZM112.17 38.50 L109.83 39.00 L106.33 40.42 L104.08 42.00 L101.58 44.58 L99.42 48.25 L98.67 50.50 L98.25 53.17 L98.42 57.17 L100.58 62.83 L102.25 65.00 L105.50 67.83 L108.42 69.33 L111.08 70.08 L116.17 70.25 L121.50 68.67 L125.17 66.08 L127.08 63.92 L129.58 58.75 L130.17 55.17 L130.08 52.83 L129.50 49.75 L128.42 47.00 L126.08 43.67 L121.92 40.33 L119.00 39.08 L116.50 38.50Z';
const logoMark = (fill='#fff') => `<svg viewBox="54.6 37.4 119.2 140.9" xmlns="http://www.w3.org/2000/svg"><path fill="${fill}" fill-rule="evenodd" d="${MARK_D}"/></svg>`;

// ---------- Klinika / server ----------
let clinicKey = new URLSearchParams(location.search).get('k');
if (clinicKey && CLINICS[clinicKey]) LS.set('mv_clinic', clinicKey); else clinicKey = LS.get('mv_clinic', null);
const API = (clinicKey && CLINICS[clinicKey]) || null;
const DEMO = !API;

const S = {
  user:null, token:null, page:null, sub:null, lic:null, cursor:0,
  calDate:today(), calDoc:'all', patQ:'', pTab:'hist', selTooth:null,
  cashFrom:today(), cashTo:today(), repM:today().slice(0,7), setTab:'clinic',
  D:emptyD()
};
function emptyD(){ return {settings:{}, users:[], doctors:[], services:[], patients:[], appointments:[], payments:[], stock:[], stockmoves:[]}; }
const byId = (c,id) => (S.D[c]||[]).find(x=>x.id===id);
const isDoc = () => S.user && S.user.role==='doctor';
const canManage = () => S.user && (S.user.role==='admin' || S.user.role==='owner');
const CK = () => 'mv_cache_'+(clinicKey||'demo');
const visAppts = () => isDoc() ? S.D.appointments.filter(a=>a.doctorId===S.user.doctorId) : S.D.appointments;
const visDocs = () => { const d=S.D.doctors.filter(x=>!x.archived); return isDoc()? d.filter(x=>x.id===S.user.doctorId) : d; };
// Modullar: Vector Studio admin panelidan har bir klinikaga yoqiladi (lic), klinika o'zi ham dental/telegram'ni o'chira oladi
const MODS = {kassa:{t:"Kassa va to'lovlar",d:"Naqd, karta, Click, Payme · qarzdorlar ro'yxati",i:'wallet'},reports:{t:'Hisobotlar',d:"Oylik tushum, xizmatlar, kelmay qolish foizi, Excel",i:'chart'},salary:{t:'Shifokor maoshi',d:'Ishlagan summadan foiz — avtomatik hisoblanadi',i:'user'},dental:{t:'Tish formulasi',d:'Bemor kartasida 32 ta tish sxemasi',i:'tooth'},telegram:{t:'Telegram eslatmalar',d:'Qabuldan 1 kun va 2 soat oldin bemorga xabar',i:'tg'},stock:{t:'Ombor',d:"Materiallar qoldig'i, kirim-chiqim, kam qolganda ogohlantirish",i:'box'}};
const M = k => DEMO ? true : !!(S.lic && S.lic.modules && S.lic.modules[k]);
const dental = () => M('dental') && (S.D.settings.modules||{}).dental!==false;

async function call(action, payload={}) {
  const res = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, token:S.token, ...payload})});
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.msg || j.error || 'Xatolik'); e.code = j.error || 'SERVER'; e.data = j; throw e; }
  return j;
}
function handleErr(e) {
  if (e.code === 'AUTH') { toast('Sessiya tugadi, qaytadan kiring'); logout(true); return; }
  if (e.code === 'SUB') { S.sub = {...(S.sub||{}), expired:true}; closeModal(); render(); return; }
  if (e.code === 'PASS') { S.user = {...S.user, mustChange:true}; forcePass(); return; }
  toast(e.message || 'Xatolik yuz berdi');
}
// Server rad etsa: xabarni ko'rsatamiz va ma'lumotni serverdagi holatga qaytaramiz
function rejected(e){
  if (['AUTH','SUB','PASS'].includes(e.code)) return handleErr(e);
  setTimeout(()=>toast(e.message||'Saqlanmadi'), 400);
  DB.load(true).then(()=>{ if(!$('#modal-root').innerHTML) render(); }).catch(()=>{});
}
function applyData(r){
  if (r.full) S.D = {...emptyD(), ...r.data};
  else Object.keys(r.data||{}).forEach(c=>{
    const list=r.data[c]; if(!list||!list.length) return;
    if (c==='settings') { const x=list[list.length-1]; if(!x._del) S.D.settings=x; return; }
    const arr=S.D[c]||(S.D[c]=[]);
    list.forEach(x=>{ const i=arr.findIndex(y=>y.id===x.id); if(x._del){ if(i>=0) arr.splice(i,1); } else if(i>=0) arr[i]=x; else arr.push(x); });
  });
  S.cursor=r.cursor||S.cursor; S.sub=r.sub||S.sub; S.lic=r.lic||S.lic; if (r.user) S.user=r.user;
  LS.set('mv_sess', {token:S.token, user:S.user});
  LS.set(CK(), {D:S.D, cursor:S.cursor, sub:S.sub, lic:S.lic, uid:S.user&&S.user.id});
}

const DB = {
  async login(l, p) {
    if (DEMO) {
      let d = LS.get('mv_demo', null); if (!d) { d = seedDemo(); LS.set('mv_demo', d); }
      const u = d.users.find(x => x.login === l.trim().toLowerCase() && x.pass === p);
      if (!u) throw new Error("Login yoki parol noto'g'ri");
      const {pass, ...user} = u; return {token:'demo', user};
    }
    return await call('login', {login:l.trim().toLowerCase(), pass:p});
  },
  async load(full) {
    if (DEMO) { let d = LS.get('mv_demo', null); if (!d) { d = seedDemo(); LS.set('mv_demo', d); } S.D = {...emptyD(), ...d}; return; }
    // birinchi marta — hammasi; keyin faqat o'zgarganlari (tez va internetni tejaydi)
    const r = await call('load', (!full && S.cursor) ? {since:S.cursor} : {});
    applyData(r);
  },
  async save(coll, item) {
    const local = {...item}; delete local.newPass;
    if (coll === 'settings') S.D.settings = local;
    else { const arr = S.D[coll]; const i = arr.findIndex(x=>x.id===item.id); if (i>=0) arr[i]=local; else arr.push(local); }
    if (DEMO) { if (coll==='users' && item.newPass) { const u=S.D.users.find(x=>x.id===item.id); u.pass=item.newPass; } LS.set('mv_demo', S.D); return; }
    try { const r = await call('save', {coll, item}); if (r._u) { local._u = r._u; if (coll==='settings') S.D.settings._u=r._u; LS.set(CK(), {D:S.D, cursor:S.cursor, sub:S.sub, lic:S.lic, uid:S.user&&S.user.id}); } }
    catch (e) { if (e.code) rejected(e); else { queue({a:'save', p:{coll,item}}); toast("Internet yo'q — keyin avtomatik saqlanadi"); } }
  },
  async del(coll, id) {
    S.D[coll] = S.D[coll].filter(x=>x.id!==id);
    if (DEMO) { LS.set('mv_demo', S.D); return; }
    try { await call('del', {coll, id}); }
    catch (e) { if (e.code) rejected(e); else queue({a:'del', p:{coll,id}}); }
  }
};
function queue(op){ const q=LS.get('mv_q',[]); q.push(op); LS.set('mv_q',q); }
async function flushQ(){
  const q = LS.get('mv_q',[]); if (!q.length) return true;
  const rest = [];
  for (const op of q) { try { await call(op.a, op.p); } catch(e){ if (e.code==='CONFLICT') toast("Internetsiz kiritilgan o'zgarish boshqa xodimnikidan eski — serverdagisi qoldi"); else if (e.code) handleErr(e); else rest.push(op); } }
  LS.set('mv_q', rest); return !rest.length;
}
async function sync(){
  if (DEMO || !S.user || document.hidden) return;
  if ($('#modal-root').innerHTML) return;           // forma ochiq bo'lsa, xalaqit bermaymiz
  try { if (await flushQ()) { await DB.load(); if (!$('#modal-root').innerHTML && !document.activeElement.matches('input,textarea,select')) render(); } }
  catch(e){ if (e.code) handleErr(e); }
}

function patientFin(pid){

}

// ---------- Qabullar kalendari ----------
const SLOT=30, SH=46;
function pageCal(){
  const d=S.calDate, st=S.D.settings, s=toMin(st.workStart||'08:00'), e=toMin(st.workEnd||'20:00'), n=Math.max(1,(e-s)/SLOT);
  const docs=visDocs(); let shown=docs; if (!isDoc() && S.calDoc!=='all') shown=docs.filter(x=>x.id===S.calDoc);
  const ap=S.D.appointments.filter(a=>a.date===d && a.status!=='cancel');
  const canceled=S.D.appointments.filter(a=>a.date===d && a.status==='cancel' && shown.some(x=>x.id===a.doctorId));
  const isSun=new Date(d+'T00:00').getDay()===0;
  const nm=toMin(nowHM()); const showNow=d===today() && nm>=s && nm<=e;
  const times=[...Array(n)].map((_,i)=>i%2===0?`<div style="top:${i*SH}px">${fromMin(s+i*SLOT)}</div>`:'').join('');
  const cols=shown.map(doc=>`<div class="cal-col ${isSun?'off':''}" style="height:${n*SH}px;--h:${SH}px" onclick="calClick(event,'${doc.id}')">
    ${ap.filter(a=>a.doctorId===doc.id).map(a=>{ const top=(toMin(a.time)-s)/SLOT*SH, h=Math.max(SH-4,(a.dur||30)/SLOT*SH-4);
      return `<div class="ap ${a.status}" style="--c:${doc.color};top:${top+2}px;height:${h}px" onclick="event.stopPropagation();viewAppt('${a.id}')">
        <b>${esc(pName(a.patientId))}</b><small>${a.time}–${fromMin(toMin(a.time)+(a.dur||30))} · ${STATUS[a.status]}</small>${h>60?`<small>${esc(svcNames(a))}</small>`:''}</div>`; }).join('')}
    ${showNow?`<div class="now" style="top:${(nm-s)/SLOT*SH}px"></div>`:''}</div>`).join('');
  const chips = isDoc()?'':`<div class="seg"><button class="${S.calDoc==='all'?'on':''}" onclick="S.calDoc='all';render()">Hammasi</button>${docs.map(x=>`<button class="${S.calDoc===x.id?'on':''}" onclick="S.calDoc='${x.id}';render()"><i class="dot" style="background:${x.color};margin-right:6px"></i>${esc(x.name.replace(/^Dr\.\s*/,''))}</button>`).join('')}</div>`;
  return `<div class="top"><div><h1>Qabullar</h1><p>${ap.length} ta qabul · bo'sh joyni bosib yangi qabul qo'shing</p></div>
    <div class="acts"><button class="btn" onclick="openApptForm({date:S.calDate})">${ic('plus')}Yangi qabul</button></div></div>
  <div class="cal-bar">
    <button class="x" onclick="S.calDate=addDays(S.calDate,-1);render()">${ic('left')}</button>
    <button class="btn ghost sm" onclick="S.calDate=today();render()">Bugun</button>
    <button class="x" onclick="S.calDate=addDays(S.calDate,1);render()">${ic('right')}</button>
    <h2>${dateLong(d)}</h2>
    <input type="date" class="in" style="width:auto;min-height:36px;padding:6px 10px" value="${d}" onchange="if(this.value){S.calDate=this.value;render()}">
  </div>
  ${chips?`<div style="margin-bottom:12px;overflow-x:auto">${chips}</div>`:''}
  ${shown.length?`<div class="card cal" id="cal"><div class="cal-in" style="grid-template-columns:62px repeat(${shown.length},minmax(200px,1fr))">
    <div class="cal-hd c0"></div>
    ${shown.map(doc=>`<div class="cal-hd"><i class="dot" style="background:${doc.color}"></i><div>${esc(doc.name)}<small>${esc(doc.spec||'')}</small></div></div>`).join('')}
    <div class="cal-times" style="height:${n*SH}px;position:sticky;left:0">${times}</div>
    ${cols}
  </div></div>`:`<div class="card empty">Avval Sozlamalar → Shifokorlar bo'limida shifokor qo'shing</div>`}
  <div class="legend"><span><span class="tag t-new">Kutilmoqda</span></span><span><span class="tag t-came">Keldi</span></span><span><span class="tag t-done">Yakunlandi</span></span><span><span class="tag t-noshow">Kelmadi</span></span>${canceled.length?`<span>· Bekor qilingan: ${canceled.length} ta</span>`:''}</div>`;
}
function scrollCal(){
  const c=$('#cal'); if(!c) return; const s=toMin(S.D.settings.workStart||'08:00');
  const ap=S.D.appointments.filter(a=>a.date===S.calDate && a.status!=='cancel').map(a=>toMin(a.time));
  const target = S.calDate===today() ? toMin(nowHM())-60 : (ap.length?Math.min(...ap)-30:s);
  c.scrollTop = Math.max(0,(target-s)/SLOT*SH);
}
function calClick(ev, docId){
  const r=ev.currentTarget.getBoundingClientRect(); const s=toMin(S.D.settings.workStart||'08:00');
  const m = s + Math.floor((ev.clientY-r.top)/SH)*SLOT;
  openApptForm({doctorId:docId, date:S.calDate, time:fromMin(m)});
}

// ---------- Qabul formasi ----------
let AF=null;
function timeOptions(sel){
  const st=S.D.settings; const s=toMin(st.workStart||'08:00'), e=toMin(st.workEnd||'20:00'); const out=[];
  for (let m=s;m<e;m+=15) out.push(fromMin(m)); if (sel && !out.includes(sel)) out.push(sel);
  return out.sort().map(t=>`<option ${t===sel?'selected':''}>${t}</option>`).join('');
}
function openApptForm(pre={}, id=null){
  const a = id ? {...byId('appointments',id)} : {id:null, patientId:pre.patientId||'', doctorId:pre.doctorId||(isDoc()?S.user.doctorId:((visDocs()[0]||{}).id||'')), date:pre.date||S.calDate, time:pre.time||'09:00', dur:30, services:[], total:0, note:'', status:'new'};
  AF = a; AF._new = null;
  const docs = visDocs();
  openModal(mHead(id?'Qabulni tahrirlash':'Yangi qabul')+`<div class="md-b">
    <div class="f"><span class="fl">Bemor</span><div id="af-p"></div></div>
    <div class="row"><label class="f"><span>Shifokor</span><select class="in" id="af-doc">${docs.map(d=>`<option value="${d.id}" ${d.id===a.doctorId?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>
      <label class="f"><span>Sana</span><input type="date" class="in" id="af-date" value="${a.date}"></label></div>
    <div class="row"><label class="f"><span>Vaqt</span><select class="in" id="af-time">${timeOptions(a.time)}</select></label>
      <label class="f"><span>Davomiyligi</span><select class="in" id="af-dur">${[15,30,45,60,90,120].map(m=>`<option value="${m}" ${m===(a.dur||30)?'selected':''}>${m<60?m+' daqiqa':(m/60)+' soat'}</option>`).join('')}</select></label></div>
    <div class="f"><span class="fl">Xizmatlar</span><div class="svc-list">${S.D.services.filter(x=>!x.archived).map(x=>`<label class="svc"><input type="checkbox" class="svc-cb" value="${x.id}" ${(a.services||[]).includes(x.id)?'checked':''} onchange="afTotal()">${esc(x.name)}<em>${num(x.price)}</em></label>`).join('')||'<div class="empty">Xizmatlar qo\'shilmagan</div>'}</div></div>
    <div class="row"><label class="f"><span>Jami summa (so'm)</span><input class="in" id="af-total" type="number" min="0" step="1000" value="${a.total||0}"></label><div></div></div>
    <label class="f"><span>Izoh</span><textarea class="in" id="af-note" rows="2" placeholder="Masalan: tish og'rig'i, birinchi marta">${esc(a.note)}</textarea></label>
  </div><div class="md-f"><button class="btn ghost" onclick="closeModal()">Bekor</button><button class="btn" onclick="saveAppt()">${ic('check')}Saqlash</button></div>`);
  renderPP();
}
function afTotal(){ $('#af-total').value = sum($$('.svc-cb:checked').map(x=>byId('services',x.value)),'price'); }
function renderPP(){
  const el=$('#af-p'); const p=AF.patientId && byId('patients',AF.patientId);
  if (p) { el.innerHTML=`<div class="pp-sel"><div class="who"><div class="av">${initials(p.name)}</div><div><b>${esc(p.name)}</b><small>${esc(p.phone)}</small></div></div><button class="btn ghost sm" onclick="AF.patientId='';renderPP()">O'zgartirish</button></div>`; return; }
  if (AF._new) { el.innerHTML=`<div class="row"><input class="in" id="np-name" placeholder="Ism familiya" value="${esc(AF._new.name||'')}"><input class="in" id="np-phone" placeholder="+998 90 123 45 67" inputmode="tel" value="${esc(AF._new.phone||'')}"></div><button class="link" style="margin-top:8px" onclick="AF._new=null;renderPP()">← Bazadan tanlash</button>`; setTimeout(()=>$('#np-name')&&$('#np-name').focus(),30); return; }
  el.innerHTML=`<div class="pp"><div class="srch" style="max-width:none">${ic('search')}<input class="in" id="pp-q" placeholder="Ism yoki telefon raqam bo'yicha qidiring" oninput="ppList()" autocomplete="off"></div><div class="pp-list" id="pp-l"></div></div>`; ppList();
}
function ppList(){
  const q=($('#pp-q').value||'').toLowerCase().trim(), qd=digits(q);
  const r=S.D.patients.filter(p=>!q || p.name.toLowerCase().includes(q) || (qd.length>=3 && digits(p.phone).includes(qd))).slice(0,5);
  $('#pp-l').innerHTML = r.map(p=>`<div class="pp-i" onclick="AF.patientId='${p.id}';renderPP()"><b>${esc(p.name)}</b><small>${esc(p.phone)}</small></div>`).join('') + `<div class="pp-i add" onclick="ppNew()">+ Yangi bemor qo'shish</div>`;
}
function ppNew(){ const q=($('#pp-q').value||'').trim(); AF._new = /\d{3}/.test(q)?{phone:q}:{name:q}; renderPP(); }
async function saveAppt(){
  const a = {...AF};
  if (AF._new) {
    const name=$('#np-name').value.trim(), phone=$('#np-phone').value.trim();
    if (!name) return toast('Bemor ismini kiriting');
    if (phone) { const dup=S.D.patients.find(p=>digits(p.phone).slice(-9)===digits(phone).slice(-9)); if (dup) { AF.patientId=dup.id; AF._new=null; renderPP(); return toast('Bu raqam bazada bor — '+dup.name+' tanlandi'); } }
    const p={id:uid('p'), name, phone, createdAt:today(), teeth:{}, note:''};
    await DB.save('patients',p); AF.patientId=p.id; AF._new=null; a.patientId=p.id;
  }
  if (!a.patientId) return toast('Bemorni tanlang');
  delete a._new;
  a.doctorId=$('#af-doc').value; a.date=$('#af-date').value; a.time=$('#af-time').value; a.dur=+$('#af-dur').value;
  a.services=$$('.svc-cb:checked').map(x=>x.value); a.total=Math.max(0,+$('#af-total').value||0); a.note=$('#af-note').value.trim();
  if (!a.doctorId) return toast('Shifokorni tanlang');
  if (!a.date) return toast('Sanani tanlang');
  const s=toMin(a.time), e=s+a.dur;
  const clash=S.D.appointments.find(x=>x.id!==a.id && x.doctorId===a.doctorId && x.date===a.date && !['cancel','noshow'].includes(x.status) && toMin(x.time)<e && toMin(x.time)+(x.dur||30)>s);
  if (clash) return toast(`Bu vaqtda shifokor band: ${clash.time} — ${pName(clash.patientId)}`);
  const isNew=!a.id;
  if (isNew) { a.id=uid('a'); a.createdAt=new Date().toISOString(); a.createdBy=S.user.name; }
  else if (a.date!==byId('appointments',a.id).date || a.time!==byId('appointments',a.id).time) a.rem={};   // vaqt o'zgarsa, eslatma qaytadan boradi
  await DB.save('appointments',a); closeModal(); S.calDate=a.date; render(); toast(isNew?'Qabul qo\'shildi':'Saqlandi');
}

// ---------- Qabulni ko'rish ----------
function viewAppt(id){
  const a=byId('appointments',id); if(!a) return; const p=byId('patients',a.patientId)||{name:'—',phone:''};
  const paid=apptPaid(id), rest=Math.max(0,(a.status==='done'?a.total:0)-paid);
  const sts=[['came','Keldi','user'],['done','Yakunlash','check'],['noshow','Kelmadi','x'],['cancel','Bekor','clock']];
  openModal(mHead('Qabul ma\'lumotlari')+`<div class="md-b">
    <div style="display:flex;align-items:center;gap:12px"><div class="av lg">${initials(p.name)}</div><div style="flex:1;min-width:0">
      <a class="link" style="font-size:17px" onclick="openPatient('${p.id}')">${esc(p.name)}</a>
      <div class="mut" style="margin-top:2px">${p.phone?`<a href="tel:${digits(p.phone)}" style="text-decoration:none">${esc(p.phone)}</a>`:''} ${p.tgChatId?`<span class="tg" title="Telegram ulangan">${ic('tg')}</span>`:''}</div></div>${statusTag(a.status)}</div>
    <div class="info">
      <div><small>Sana</small><b>${dateShort(a.date)}</b></div><div><small>Vaqt</small><b>${a.time}–${fromMin(toMin(a.time)+(a.dur||30))}</b></div>
      <div><small>Shifokor</small><b>${esc(dName(a.doctorId).replace(/^Dr\.\s*/,''))}</b></div>
      <div><small>Summa</small><b>${money(a.total)}</b></div><div><small>To'langan</small><b style="color:var(--green)">${money(paid)}</b></div><div><small>Qoldiq</small><b style="color:${rest?'var(--red)':'inherit'}">${money(rest)}</b></div>
    </div>
    ${(a.services||[]).length?`<div class="fl">Xizmatlar</div><div class="chips">${a.services.map(sid=>{const s=byId('services',sid);return s?`<span class="chip">${esc(s.name)}</span>`:''}).join('')}</div>`:''}
    ${a.note?`<div class="fl" style="margin-top:14px">Izoh</div><p style="font-weight:600">${esc(a.note)}</p>`:''}
    ${a.diag?`<div class="fl" style="margin-top:14px">Bajarilgan ish / tashxis</div><p style="font-weight:600">${esc(a.diag)}</p>`:''}
    <div class="st-row">${sts.map(([k,t,i])=>`<button class="${a.status===k?'on':''}" onclick="setStatus('${id}','${k}')">${ic(i)}${t}</button>`).join('')}</div>
  </div><div class="md-f">
    ${canManage()||isDoc()?`<button class="btn danger" onclick="delAppt('${id}')">O'chirish</button>`:''}<span style="flex:1"></span>
    <button class="btn ghost" onclick="openApptForm({},'${id}')">Tahrirlash</button>
    ${isDoc()||!M('kassa')?'':`<button class="btn green" onclick="openPay({patientId:'${p.id}',appointmentId:'${id}',amount:${rest}})">${ic('wallet')}To'lov</button>`}
  </div>`);
}
async function setStatus(id, st){
  if (st==='done') return openDone(id);
  const a={...byId('appointments',id), status:st}; await DB.save('appointments',a); render(); viewAppt(id); toast(STATUS[st]);
}
function delAppt(id){ ask('Bu qabulni o\'chirasizmi? To\'lovlar saqlanib qoladi.', async()=>{ await DB.del('appointments',id); render(); toast('O\'chirildi'); }); }
function openDone(id){
  const a=byId('appointments',id); const paid=apptPaid(id); _dnPaid=paid;
  openModal(mHead('Qabulni yakunlash')+`<div class="md-b">
    <div class="who" style="margin-bottom:16px"><div class="av">${initials(pName(a.patientId))}</div><div><b>${esc(pName(a.patientId))}</b><small>${dateShort(a.date)} · ${a.time} · ${esc(dName(a.doctorId))}</small></div></div>
    <div class="f"><span class="fl">Bajarilgan xizmatlar</span><div class="svc-list">${S.D.services.filter(x=>!x.archived||(a.services||[]).includes(x.id)).map(x=>`<label class="svc"><input type="checkbox" class="svc-cb" value="${x.id}" ${(a.services||[]).includes(x.id)?'checked':''} onchange="dnTotal()">${esc(x.name)}<em>${num(x.price)}</em></label>`).join('')}</div></div>
    <div class="row"><label class="f"><span>Jami summa (so'm)</span><input class="in" id="dn-total" type="number" min="0" step="1000" value="${a.total||0}" oninput="dnPay()"></label>
      <label class="f"><span>Hozir to'lanadi</span><input class="in" id="dn-pay" type="number" min="0" step="1000" value="${Math.max(0,(a.total||0)-paid)}"></label></div>
    ${isDoc()||!M('kassa')?'':`<div class="f"><span class="fl">To'lov turi</span><div class="pills">${Object.entries(METHODS).map(([k,v],i)=>`<label class="pill"><input type="radio" name="dn-m" value="${k}" ${i?'':'checked'}><span>${v}</span></label>`).join('')}</div></div>`}
    <label class="f"><span>Bajarilgan ish / tashxis</span><textarea class="in" id="dn-diag" rows="3" placeholder="Masalan: 36-tishga plomba qo'yildi">${esc(a.diag||'')}</textarea></label>

}
function dnTotal(){ $('#dn-total').value = sum($$('.svc-cb:checked').map(x=>byId('services',x.value)),'price'); dnPay(); }
let _dnPaid=0;
function dnPay(){ $('#dn-pay').value = Math.max(0,(+$('#dn-total').value||0)-_dnPaid); }
async function saveDone(id){
  const a={...byId('appointments',id)}; a.status='done'; a.services=$$('.svc-cb:checked').map(x=>x.value); a.total=Math.max(0,+$('#dn-total').value||0); a.diag=$('#dn-diag').value.trim(); a.doneAt=new Date().toISOString();

function openPay(pre){
  const pts=S.D.patients.map(p=>({p,d:patientFin(p.id).debt})).sort((a,b)=>b.d-a.d||a.p.name.localeCompare(b.p.name));

    <div id="py-info" class="mut" style="margin:-6px 0 12px"></div>
    <label class="f"><span>Summa (so'm)</span><input class="in" id="py-a" type="number" min="0" step="1000" value="${pre.amount||''}" placeholder="0" style="font-size:18px;font-weight:800"></label>
    <div class="f"><span class="fl">To'lov turi</span><div class="pills">${Object.entries(METHODS).map(([k,v],i)=>`<label class="pill"><input type="radio" name="py-m" value="${k}" ${i?'':'checked'}><span>${v}</span></label>`).join('')}</div></div>

}
function pyDebt(fill=true){ const id=$('#py-p').value; if(!id){$('#py-info').textContent='';return} const f=patientFin(id); $('#py-info').innerHTML = f.debt?`Qarzi: <b style="color:var(--red)">${money(f.debt)}</b>`:f.adv?`Avans: <b style="color:var(--green)">${money(f.adv)}</b>`:'Qarzi yo\'q'; if(fill && f.debt && !$('#py-a').value) $('#py-a').value=f.debt; }
async function savePay(apId){
  const pid=$('#py-p').value, amt=Math.round(+$('#py-a').value||0);

function delPay(id){ ask("Bu to'lovni o'chirasizmi? Kassa hisobi o'zgaradi.", async()=>{ await DB.del('payments',id); render(); toast("To'lov o'chirildi"); }); }

function myPatients(){ if(!isDoc()) return S.D.patients; const ids=new Set(visAppts().map(a=>a.patientId)); return S.D.patients.filter(p=>ids.has(p.id)); }
function pagePat(){

async function savePatient(id){
  const name=$('#pf-name').value.trim(), phone=$('#pf-phone').value.trim(); if(!name) return toast('Ismni kiriting');
  if (phone) { const dup=S.D.patients.find(x=>x.id!==id && digits(x.phone).slice(-9)===digits(phone).slice(-9)); if(dup) return toast('Bu raqam bilan bemor bor: '+dup.name); }
  const old = id ? byId('patients',id) : {id:uid('p'), createdAt:today(), teeth:{}};
  const p = {...old, name, phone, birth:$('#pf-birth').value, gender:$('#pf-gender').value, address:$('#pf-addr').value.trim(), note:$('#pf-note').value.trim()};
  await DB.save('patients',p); render(); openPatient(p.id); toast('Saqlandi');
}
function delPatient(id){
  if (S.D.appointments.some(a=>a.patientId===id) || S.D.payments.some(x=>x.patientId===id)) return toast("Bemorning tarixi bor — o'chirib bo'lmaydi");
  ask("Bemorni o'chirasizmi?", async()=>{ await DB.del('patients',id); render(); toast("O'chirildi"); });
}
function openPatient(id, tab){

  if (S.pTab==='pay') body = pays.length ? `<div class="card" style="box-shadow:none"><div class="tw"><table><thead><tr><th>Sana</th><th>Summa</th><th>Turi</th><th>Qabul qildi</th></tr></thead><tbody>${pays.map(x=>`<tr><td>${dateShort(x.date)} ${x.time||''}</td><td><b>${money(x.amount)}</b></td><td>${METHODS[x.method]||x.method}</td><td>${esc(x.by||'')}</td></tr>`).join('')}</tbody></table></div></div>` : '<div class="empty">To\'lov yo\'q</div>';

  openModal(mHead('Bemor kartasi')+`<div class="md-b">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div class="av lg">${initials(p.name)}</div><div style="flex:1;min-width:160px"><div style="font-size:19px;font-weight:800">${esc(p.name)}</div>
      <div class="mut" style="margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${p.phone?`<a href="tel:${digits(p.phone)}" style="text-decoration:none;display:inline-flex;gap:5px;align-items:center">${ic('phone')}${esc(p.phone)}</a>`:''}${age!=null?`<span>${age} yosh</span>`:''}${p.tgChatId?`<span class="tg">${ic('tg')}</span>`:''}</div></div></div>
    ${isDoc()||!M('kassa')?'':`<div class="fin"><div><small>Jami xizmatlar</small><b>${money(f.charged)}</b></div><div><small>To'langan</small><b style="color:var(--green)">${money(f.paid)}</b></div><div><small>${f.adv?'Avans':'Qarz'}</small><b style="color:${f.debt?'var(--red)':f.adv?'var(--green)':'inherit'}">${money(f.debt||f.adv)}</b></div></div>`}

const TEETH_UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28], TEETH_DN=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const TS = {healthy:{t:"Sog'lom",c:'#FFFFFF'},caries:{t:'Karies',c:'#FDE68A'},treat:{t:'Davolanmoqda',c:'#FECACA'},filled:{t:'Plomba',c:'#BFDBFE'},rct:{t:'Kanal davolangan',c:'#DDD6FE'},crown:{t:'Koronka',c:'#FBCFE8'},implant:{t:'Implant',c:'#A7F3D0'},missing:{t:'Olingan',c:'none'}};
function toothSvg(st, up){
  const c=(TS[st]||TS.healthy).c, miss=st==='missing';
  const path = up ? 'M6 4c2-2 4-1 8-1s6-1 8 1c2 3 1 7-1 10-1 2-1 6-2 12-.5 3-2 3-2.5 0l-1-7c-.3-1.5-2.7-1.5-3 0l-1 7c-.5 3-2 3-2.5 0-1-6-1-10-2-12C5 11 4 7 6 4z'
                  : 'M6 28c2 2 4 1 8 1s6 1 8-1c2-3 1-7-1-10-1-2-1-6-2-12-.5-3-2-3-2.5 0l-1 7c-.3 1.5-2.7 1.5-3 0l-1-7c-.5-3-2-3-2.5 0-1 6-1 10-2 12-2 3-3 7-1 10z';
  return `<svg viewBox="0 0 28 32"><path d="${path}" fill="${miss?'none':c}" stroke="${miss?'#98A2B3':'#7C8BA8'}" stroke-width="1.3" ${miss?'stroke-dasharray="2.5 2"':''}/>${st==='implant'?'<path d="M14 9v14M11 12h6M11 16h6M11 20h6" stroke="#067647" stroke-width="1.3"/>':''}</svg>`;
}
function teethChart(p){
  const T=p.teeth||{}; const sel=S.selTooth;
  const jaw=(arr,up)=>`<div class="jaw">${arr.map((n,i)=>`${i===8?'<span class="mid"></span>':''}<button class="tooth ${sel===n?'sel':''}" title="${n}: ${(TS[T[n]]||TS.healthy).t}" onclick="S.selTooth=${n};openPatient('${p.id}')">${up?'':`<span>${n}</span>`}${toothSvg(T[n],up)}${up?`<span>${n}</span>`:''}</button>`).join('')}</div>`;
  const counts={}; Object.values(T).forEach(s=>counts[s]=(counts[s]||0)+1);
  return `<div class="teeth">${jaw(TEETH_UP,true)}${jaw(TEETH_DN,false)}</div>
    ${sel?`<div class="fl" style="margin-top:14px">${sel}-tish holatini tanlang:</div><div class="tlegend" style="margin-top:6px">${Object.entries(TS).map(([k,v])=>`<button class="${(T[sel]||'healthy')===k?'on':''}" onclick="setTooth('${p.id}',${sel},'${k}')"><i style="background:${v.c==='none'?'#fff':v.c};${k==='missing'?'border-style:dashed':''}"></i>${v.t}</button>`).join('')}</div>`
      :`<p class="mut" style="margin-top:12px">Tish ustiga bosing va holatini belgilang.</p><div class="tlegend">${Object.entries(TS).filter(([k])=>k!=='healthy').map(([k,v])=>`<button style="cursor:default"><i style="background:${v.c==='none'?'#fff':v.c};${k==='missing'?'border-style:dashed':''}"></i>${v.t}${counts[k]?` · ${counts[k]}`:''}</button>`).join('')}</div>`}`;
}
async function setTooth(pid,n,st){
  const p={...byId('patients',pid)}; p.teeth={...(p.teeth||{})}; if(st==='healthy') delete p.teeth[n]; else p.teeth[n]=st;
  await DB.save('patients',p); S.selTooth=null; openPatient(pid,'teeth'); toast(`${n}-tish: ${TS[st].t}`);
}

async function saveItem(id){ const name=$('#it-n').value.trim(); if(!name) return toast('Nomini kiriting');

function pageRep(){

  const uniq=new Set(done.map(a=>a.patientId)).size;
  const docs=S.D.doctors.map(d=>{ const dd=done.filter(a=>a.doctorId===d.id); const v=sum(dd,'total'); return {d,cnt:dd.length,pts:new Set(dd.map(a=>a.patientId)).size,ns:ns.filter(a=>a.doctorId===d.id).length,v,sal:Math.round(v*(+d.percent||0)/100)}; }).filter(x=>x.cnt||!x.d.archived);

    <div class="card kpi"><div class="l"><span class="ic v">${ic('user')}</span>Yangi bemorlar</div><div class="v">${newP}</div><div class="s">shu oy bazaga qo'shilgan</div></div>
    <div class="card kpi"><div class="l"><span class="ic r">${ic('x')}</span>Kelmay qolish</div><div class="v">${closed.length?Math.round(ns.length/closed.length*100):0}%</div><div class="s">${ns.length} ta qabul · ${money(sum(ns,'total'))}</div></div>
  </div>
  <div class="card" style="margin-bottom:14px"><div class="card-h"><h3>Shifokorlar${M('salary')?' va maosh':''}</h3>${M('salary')?'<span class="mut">Maosh = bajarilgan ish × foiz</span>':''}</div><div class="tw"><table><thead><tr><th>Shifokor</th><th>Qabullar</th><th>Bemorlar</th><th>Kelmadi</th><th${M('salary')?'':' class="r"'}>Bajarilgan ish</th>${M('salary')?'<th>Foiz</th><th class="r">Maosh</th>':''}</tr></thead><tbody>
    ${docs.map(x=>`<tr><td><span style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:${x.d.color}"></i><b>${esc(x.d.name)}</b></span></td><td>${x.cnt}</td><td>${x.pts}</td><td>${x.ns}</td><td${M('salary')?'':' class="r"'}>${money(x.v)}</td>${M('salary')?`<td>${x.d.percent||0}%</td><td class="r"><b style="color:var(--blue)">${money(x.sal)}</b></td>`:''}</tr>`).join('')}
    <tr><td><b>Jami</b></td><td><b>${sum(docs,'cnt')}</b></td><td></td><td><b>${sum(docs,'ns')}</b></td><td${M('salary')?'':' class="r"'}><b>${money(sum(docs,'v'))}</b></td>${M('salary')?`<td></td><td class="r"><b>${money(sum(docs,'sal'))}</b></td>`:''}</tr>
  </tbody></table></div></div>
  <div class="grid2">
    <div class="card"><div class="card-h"><h3>Xizmatlar bo'yicha</h3></div>${svcs.length?`<div class="tw"><table><thead><tr><th>Xizmat</th><th>Soni</th><th class="r">Summa</th></tr></thead><tbody>${svcs.map(x=>`<tr><td><b>${esc(x.s.name)}</b></td><td>${x.c}</td><td class="r">${money(x.v)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ma\'lumot yo\'q</div>'}</div>
    <div class="card"><div class="card-h"><h3>To'lov turlari</h3></div><div class="card-b">${Object.entries(METHODS).map(([k,l])=>{const v=sum(P.filter(p=>p.method===k),'amount'),tot=sum(P,'amount')||1;return `<div class="hb"><div class="hb-t"><b>${l}</b><span>${money(v)} · ${Math.round(v/tot*100)}%</span></div><div class="hb-l"><i style="width:${v/tot*100}%;background:var(--blue)"></i></div></div>`}).join('')}</div></div>
  </div>`;
}
function download(name, text, type){ try{ const b=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ toast('Yuklab bo\'lmadi'); } }
function exportCSV(){
  const m=S.repM; const rows=[['Sana','Vaqt','Bemor','Telefon','Shifokor','Xizmatlar','Holat','Summa','To\'langan']];
  S.D.appointments.filter(a=>a.date.startsWith(m)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(a=>{ const p=byId('patients',a.patientId)||{}; rows.push([a.date,a.time,p.name||'',p.phone||'',dName(a.doctorId),svcNames(a),STATUS[a.status],a.total||0,apptPaid(a.id)]); });
  download(`hisobot-${m}.csv`, '﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'), 'text/csv;charset=utf-8');
}

  <div class="switch"><div><b>Zaxira nusxa (JSON)</b><small>Barcha ma'lumotlarni bitta faylga yuklab olish</small></div><button class="btn ghost sm" onclick="backup()">${ic('down')}Yuklab olish</button></div>
  <div class="switch"><div><b>Ma'lumotlar qayerda saqlanadi?</b><small>${DEMO?'Demo rejim: faqat shu brauzerda. Haqiqiy klinikada — Google Sheets\'da, har qanday qurilmadan kirish mumkin.':'Google Sheets\'da, xavfsiz. Har qanday qurilmadan login-parol bilan kirasiz.'}</small></div></div>
  ${S.sub&&S.sub.until?`<div class="switch"><div><b>Obuna · ${esc((S.lic&&S.lic.planName)||'')}</b><small>${dateShort(S.sub.until)} gacha faol</small></div><span class="tag t-done">Faol</span></div>`:''}
  ${DEMO?`<div class="switch"><div><b>Demo ma'lumotlarni qayta tiklash</b><small>Kiritilgan barcha o'zgarishlar o'chadi</small></div><button class="btn danger sm" onclick="ask('Demo ma\\'lumotlar boshidan yaratiladi. Davom etasizmi?',()=>{LS.del('mv_demo');DB.load().then(()=>{render();toast('Tiklandi')})},'Tiklash')">Tiklash</button></div>`:''}
  </div></div>`; }
function backup(){ const d={...S.D}; d.users=d.users.map(({pass,...u})=>u); download(`zaxira-${today()}.json`, JSON.stringify(d,null,1), 'application/json'); }

// ---------- Ishga tushirish ----------
(async function init(){
  const ss=LS.get('mv_sess',null);
  if (ss && ss.user) { S.token=ss.token; S.user=ss.user;
    const c = DEMO ? null : LS.get(CK(), null);
    if (c && c.uid===S.user.id) { S.D={...emptyD(), ...c.D}; S.cursor=c.cursor||0; S.sub=c.sub; S.lic=c.lic; render(); }   // darhol ochiladi, keyin yangilanadi
    try { await DB.load(); } catch(e){ if (e.code==='AUTH') { LS.del('mv_sess'); S.user=null; } else if (e.code==='SUB') S.sub={expired:true}; else toast("Internet yo'q — oxirgi saqlangan ma'lumotlar ko'rsatilmoqda"); }
  }
  render();
  if (API) { setInterval(sync, 20000); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) sync(); }); }
  setInterval(()=>{ if(S.user && S.page==='cal' && !$('#modal-root').innerHTML && S.calDate===today()) { const c=$('#cal'); const st=c&&c.scrollTop; render(); const c2=$('#cal'); if(c2&&st!=null) c2.scrollTop=st; } }, 60000);
  try { if ('serviceWorker' in navigator && location.protocol==='https:' && !location.hostname.endsWith('claude.ai')) navigator.serviceWorker.register('sw.js').catch(()=>{}); } catch(e){}
})();
</script>
